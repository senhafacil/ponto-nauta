<style>

  .badge-feriado{background:rgba(58,166,160,.16); color:var(--accent);}
  .badge-feriado .dot{background:var(--accent);}
  .badge-sem_pausa{background:rgba(155,109,217,.16); color:#9b6dd9;}
  .badge-sem_pausa .dot{background:#9b6dd9;}
  .day-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .day-row:last-child{border-bottom:none;}

  .day-row .dname{font-weight:700; font-size:13.5px; text-transform:capitalize;}
  .day-row .dnums{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .emp-card{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .emp-card .top{display:flex; align-items:center; justify-content:space-between;}

  .select-row{display:flex; gap:10px;}
  .select-row select{margin-bottom:0;}
  .sheet{position:fixed; inset:0; background:rgba(10,14,17,.97); z-index:55; overflow:auto; padding:22px 18px 40px; display:flex; justify-content:center; align-items:flex-start;}
  .sheet-inner{width:100%; max-width:440px;}
  .chk{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink); font-weight:500; line-height:1.45; margin:14px 0; cursor:pointer;}
  .chk input{width:20px; height:20px; margin:1px 0 0; flex-shrink:0; accent-color:var(--accent);}

  .diff .arrow{color:var(--muted);}

  tr.clicavel{cursor:pointer;}
  td.aviso{color:var(--amber); font-weight:600;}

<body>

<script>
/* ======================================================================
   PONTO CERTO — configuração
   Troque pelas credenciais do seu projeto Supabase (Project Settings > API)
   e pela senha do painel admin.
   ====================================================================== */
const SUPABASE_URL = 'https://kzsospnvnrotgpquvliy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_D9fMdHocNzz_nkwhUmrwhw_6ifM0AUE';
const ADMIN_PASSWORD = '@Matheus2023';

/* ---------------------------------------------------------------------
   Localização exigida pra bater ponto pelo celular pessoal.
   Agora é configurada por funcionária, direto no painel admin (endereço
   + raio em metros) — não precisa mexer em código pra isso.
--------------------------------------------------------------------- */
function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function obterLocalizacao() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({ ok: false, erro: 'Seu navegador não suporta localização.' });
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ ok: true, lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve({ ok: false, erro: 'Não deu pra pegar sua localização. Verifique se a permissão de localização está liberada pro navegador.' }),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });
}

const sb = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ---------------------------------------------------------------------
   Regras da CLT aplicadas (mesmas usadas no controle da Luna Beleza)
   - Jornada padrão: definida por funcionária (jornada_diaria_horas)
   - Dias de folga fixa: definidos por funcionária (dias_folga, 0=dom..6=sáb)
   - Intervalo obrigatório: 1h se a jornada do dia > 6h; 15min se >4h e <=6h; 0 se <=4h
   - Tolerância de 5 min no intervalo (CLT Art.58)
   - Intervalo suprimido/reduzido além da tolerância: trabalhou o período todo
     + indenização (não é hora extra) de 1,5x sobre os minutos suprimidos (CLT Art.71 §4,
     natureza indenizatória — não reflete em FGTS/13º/férias)
   - Hora extra em dia normal: +50%
   - Hora extra em dia marcado como feriado trabalhado: +100% (todo o período)
   - Dia útil sem batida e sem justificativa: falta (débito da jornada do dia)
   - Dias marcados como folga compensada ou abono/atestado: sem débito e sem crédito
--------------------------------------------------------------------- */
const TOLERANCIA_MIN = 5;

/* ---------------------------------------------------------------------
   Calendário de feriados (nacionais + RJ estadual/municipal), calculado
   automaticamente ano a ano — não precisa marcar feriado na mão.
   Se a loja funcionar num feriado facultativo, é só marcar o dia como
   "Normal" na tela de edição do dia, que ignora o calendário pra esse dia.
--------------------------------------------------------------------- */
function calcularPascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(ano, mes - 1, dia);
}

function feriadosDoAno(ano) {
  const map = {};
  const add = (mes, dia, nome) => { map[`${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`] = nome; };
  add(1, 1, 'Confraternização Universal');
  add(1, 20, 'São Sebastião (RJ)');
  add(4, 21, 'Tiradentes');
  add(4, 23, 'São Jorge (RJ)');
  add(5, 1, 'Dia do Trabalho');
  add(9, 7, 'Independência');
  add(10, 12, 'Nossa Senhora Aparecida');
  add(11, 2, 'Finados');
  add(11, 15, 'Proclamação da República');
  add(11, 20, 'Consciência Negra');
  add(12, 25, 'Natal');
  const pascoa = calcularPascoa(ano);
  const addOffset = (offsetDias, nome) => { const d = new Date(pascoa); d.setDate(d.getDate() + offsetDias); add(d.getMonth() + 1, d.getDate(), nome); };
  addOffset(-48, 'Carnaval (segunda)');
  addOffset(-47, 'Carnaval (terça)');
  addOffset(-2, 'Sexta-feira Santa');
  addOffset(60, 'Corpus Christi');
  return map;
}
const FERIADOS_CACHE = {};
function feriadosCache(ano) { if (!FERIADOS_CACHE[ano]) FERIADOS_CACHE[ano] = feriadosDoAno(ano); return FERIADOS_CACHE[ano]; }
function nomeFeriado(dataKey) { return feriadosCache(parseInt(dataKey.slice(0, 4)))[dataKey]; }
function isFeriadoPadrao(dataKey) { return !!nomeFeriado(dataKey); }

/* ---------------------------------------------------------------------
   Estado
--------------------------------------------------------------------- */
let state = {
  screen: 'home',
  funcionarios: [],
  selectedFuncionario: null,
  pin: '',
  pinVisivel: false,
  personalUser: null,
  adminOk: false,
  adminDailyFocus: null, // id da funcionária focada no histórico
  adminDailyMes: null,   // 'AAAA-MM' do histórico (padrão: mês atual)
  adminFuncionariosAll: [],
  adminEditingId: null,
  adminEditDay: null,
  adminEditDayPunches: [],
  ultimoRelatorio: null,
  empMode: 'loja',
  corrOriginal: null,
  corrRascunho: null,
  corrDataPre: null,
  espCache: null
};

const TIPOS = [
  { key: 'entrada',      label: 'Entrada',      short: 'Chegada' },
  { key: 'saida_almoco', label: 'Saída almoço', short: 'Pausa' },
  { key: 'volta_almoco', label: 'Volta almoço', short: 'Retorno' },
  { key: 'saida',        label: 'Saída',        short: 'Fim do dia' }
];

/* ---------------------------------------------------------------------
   Armazenamento local (cache + fila offline + marcações especiais)
--------------------------------------------------------------------- */
const LS_FUNCIONARIOS = 'ponto_funcionarios_cache';
const LS_QUEUE = 'ponto_fila_offline';
const LS_PERSONAL_SESSION = 'ponto_sessao_pessoal';

function lsGet(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function lsSet(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

function diasEspeciaisKey(funcId) { return 'ponto_dias_especiais_' + funcId; }
/* Marcações de dia (feriado, folga compensada, dispensa...) ficam no banco (tabela dias_especiais),
   então valem em qualquer aparelho. O cache em memória deixa o cálculo síncrono. */
const DIAS_ESP = {};
function getDiasEspeciais(funcId) { return DIAS_ESP[funcId] ?? lsGet(diasEspeciaisKey(funcId), {}); }
async function carregarDiasEspeciais(funcId) {
  if (!sb) return;
  const { data, error } = await sb.from('dias_especiais').select('data, tipo').eq('funcionario_id', funcId);
  if (error) return; // tabela ainda não criada: segue com o que está salvo neste navegador
  const m = {}; (data || []).forEach(r => { m[r.data] = r.tipo; });
  // leva pro banco o que tinha ficado salvo só neste navegador
  const local = lsGet(diasEspeciaisKey(funcId), {});
  const novos = Object.entries(local).filter(([k]) => !(k in m));
  if (novos.length) {
    const { error: e2 } = await sb.from('dias_especiais').upsert(novos.map(([k, t]) => ({ funcionario_id: funcId, data: k, tipo: t })));
    if (e2) { DIAS_ESP[funcId] = { ...local, ...m }; return; }
    novos.forEach(([k, t]) => { m[k] = t; });
  }
  if (Object.keys(local).length) { try { localStorage.removeItem(diasEspeciaisKey(funcId)); } catch (e) {} }
  DIAS_ESP[funcId] = m;
}
async function setDiaEspecial(funcId, dataKey, tipo) {
  const m = { ...getDiasEspeciais(funcId) };
  if (tipo) m[dataKey] = tipo; else delete m[dataKey];
  DIAS_ESP[funcId] = m;
  if (!sb) { lsSet(diasEspeciaisKey(funcId), m); return; }
  const r = tipo
    ? await sb.from('dias_especiais').upsert({ funcionario_id: funcId, data: dataKey, tipo })
    : await sb.from('dias_especiais').delete().eq('funcionario_id', funcId).eq('data', dataKey);
  if (r.error) { lsSet(diasEspeciaisKey(funcId), m); showToast('Não consegui salvar no banco: ' + r.error.message); }
}

function queuePunch(entry) { const q = lsGet(LS_QUEUE, []); q.push(entry); lsSet(LS_QUEUE, q); }

async function trySyncQueue() {
  if (!sb) return;
  const q = lsGet(LS_QUEUE, []);
  if (!q.length) return;
  const remaining = [];
  for (const entry of q) {
    const { error } = await sb.from('pontos').insert(entry);
    if (error) remaining.push(entry);
  }
  lsSet(LS_QUEUE, remaining);
}

/* ---------------------------------------------------------------------
   Dados: funcionárias
--------------------------------------------------------------------- */
async function loadFuncionarios() {
  if (sb) {
    const { data, error } = await sb.from('funcionarios').select('*').eq('ativo', true).order('nome');
    if (!error && data) { state.funcionarios = data; lsSet(LS_FUNCIONARIOS, data); return data; }
  }
  const cached = lsGet(LS_FUNCIONARIOS, []);
  state.funcionarios = cached;
  return cached;
}
function initials(nome) { return nome.trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }

/* ---------------------------------------------------------------------
   Registrar ponto
--------------------------------------------------------------------- */
async function registrarPonto(funcionarioId, tipo, dispositivo) {
  const entry = { funcionario_id: funcionarioId, tipo, dispositivo, registrado_em: new Date().toISOString() };
  if (sb) { const { error } = await sb.from('pontos').insert(entry); if (error) queuePunch(entry); }
  else queuePunch(entry);
  return entry;
}

function localKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayKey() { return localKey(new Date()); }

async function getPunchesRange(funcionarioId, startDate, endDate) {
  if (sb) {
    const { data, error } = await sb.from('pontos').select('*')
      .eq('funcionario_id', funcionarioId)
      .gte('registrado_em', startDate.toISOString())
      .lt('registrado_em', endDate.toISOString())
      .order('registrado_em');
    if (!error) return data || [];
  }
  const q = lsGet(LS_QUEUE, []);
  return q.filter(p => p.funcionario_id === funcionarioId && new Date(p.registrado_em) >= startDate && new Date(p.registrado_em) < endDate);
}

async function getPunchesToday(funcionarioId) {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  return getPunchesRange(funcionarioId, start, end);
}

function nextExpectedType(punchesToday) {
  const done = punchesToday.map(p => p.tipo);
  for (const t of TIPOS) if (!done.includes(t.key)) return t.key;
  return null;
}

/* ---------------------------------------------------------------------
   Relógio ao vivo
--------------------------------------------------------------------- */
let clockInterval = null;
function startClock() {
  clearInterval(clockInterval);
  clockInterval = setInterval(() => { const el = document.getElementById('liveClock'); if (el) el.textContent = fmtTime(new Date()); }, 1000);
}
function fmtTime(d) { return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function fmtTimeShort(iso) { return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function fmtDate(d) { return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }); }
function fmtHoras(min) { const sinal = min < 0 ? '-' : ''; min = Math.abs(min); const h = Math.floor(min / 60); const m = Math.round(min % 60); return sinal + h + 'h' + String(m).padStart(2, '0'); }

/* ---------------------------------------------------------------------
   Motor de cálculo — classifica e calcula um único dia
--------------------------------------------------------------------- */
function minutesBetween(a, b) { return Math.max(0, (new Date(b) - new Date(a)) / 60000); }

function classificarDia(dataKey, funcionario, punches, isToday) {
  const date = new Date(dataKey + 'T12:00:00');
  const weekday = date.getDay();
  const diasEspeciais = getDiasEspeciais(funcionario.id);
  const especialManual = diasEspeciais[dataKey];
  // "normal" força o dia a ignorar o feriado automático (ex: loja aberta num facultativo)
  const especial = especialManual === 'normal' ? undefined : (especialManual || (isFeriadoPadrao(dataKey) ? 'feriado' : undefined));
  const isDSR = weekday === 0 || weekday === 1; // domingo e segunda: descanso semanal remunerado (salão fechado)
  const isFolgaFixa = isDSR || (funcionario.dias_folga || []).includes(weekday);
  const jornada = (funcionario.jornada_diaria_horas || 8) * 60;
  const temPonto = punches.length > 0;

  const base = { dataKey, weekday, especial, especialManual, trabalhado: 0, extra: 0, deficit: 0, indenizacao: 0, compensado: 0, taxaExtra: 1.5, byTipo: {}, byTipoDispositivo: {} };
  punches.forEach(p => { base.byTipo[p.tipo] = p.registrado_em; base.byTipoDispositivo[p.tipo] = p.dispositivo; });

  if (!temPonto) {
    if (especial === 'feriado') return { ...base, status: 'feriado' };
    if (isFolgaFixa || especial === 'folga_comp' || especial === 'abono' || especial === 'dispensa') {
      const rotuloFolga = especial === 'dispensa' ? 'Dispensa remunerada' : especial === 'folga_comp' ? 'Folga compensada' : especial === 'abono' ? 'Abono / atestado' : (isDSR ? 'DSR' : 'Folga');
      const compensado = (especial === 'folga_comp' && !isFolgaFixa) ? jornada : 0; // minutos descontados das horas extras
      return { ...base, status: 'folga', rotuloFolga, compensado };
    }
    if (isToday) return { ...base, status: 'pendente' };
    if (date > new Date()) return { ...base, status: 'futuro' };
    return { ...base, status: 'falta', deficit: jornada };
  }

  const b = base.byTipo;
  const completo = !!(b.entrada && b.saida);

  // Calcula trabalhado/extra/devedora/indenização a partir de um início e um fim
  // (reaproveitado tanto pro dia completo quanto pro caso "bateu só 2 pontos").
  function calcularComEntradaESaida(inicio, fim) {
    const span = minutesBetween(inicio, fim);
    const breakTaken = (b.saida_almoco && b.volta_almoco) ? minutesBetween(b.saida_almoco, b.volta_almoco) : 0;
    const requiredBreak = span > 360 ? 60 : (span > 240 ? 15 : 0);
    let trabalhado, indenizacao = 0;
    if (requiredBreak > 0 && breakTaken < requiredBreak - TOLERANCIA_MIN) {
      trabalhado = span; // intervalo suprimido/reduzido: trabalhou o período todo
      indenizacao = requiredBreak - breakTaken; // minutos-base pra indenização (1,5x, NÃO é hora extra)
    } else {
      trabalhado = span - breakTaken;
    }
    let extra = 0, deficit = 0, taxaExtra = 1.5;
    if (especial === 'feriado') { extra = trabalhado; taxaExtra = 2; }
    else { extra = Math.max(0, trabalhado - jornada); deficit = Math.max(0, jornada - trabalhado); }
    return { trabalhado, extra, deficit, indenizacao, taxaExtra };
  }

  if (!completo) {
    // Caso comum: ela bateu só "entrada" e "saída almoço" e esqueceu as outras duas —
    // normalmente é porque trabalhou direto, sem pausa, e esse 2º toque era pra ser a
    // saída do dia. Tratamos como um dia sem intervalo, separando a hora extra "de
    // verdade" da indenização por não ter feito a pausa — em vez de somar tudo junto
    // sem mostrar nada no Extra/Devedora.
    if (b.entrada && b.saida_almoco && !b.volta_almoco && !b.saida && !isToday) {
      const calc = calcularComEntradaESaida(b.entrada, b.saida_almoco);
      return { ...base, status: 'sem_pausa', ...calc };
    }
    let trabalhadoParcial = 0;
    if (b.entrada && b.saida_almoco) trabalhadoParcial += minutesBetween(b.entrada, b.saida_almoco);
    if (b.volta_almoco && b.saida) trabalhadoParcial += minutesBetween(b.volta_almoco, b.saida);
    return { ...base, status: isToday ? 'andamento' : 'incompleto', trabalhado: trabalhadoParcial };
  }

  const calc = calcularComEntradaESaida(b.entrada, b.saida);
  return { ...base, status: 'completo', ...calc };
}

function statusMeta(status) {
  const map = {
    completo:   { label: 'Completo',        cls: 'completo' },
    andamento:  { label: 'Em andamento',    cls: 'andamento' },
    incompleto: { label: 'Incompleto',      cls: 'incompleto' },
    falta:      { label: 'Não bateu',       cls: 'falta' },
    pendente:   { label: 'Aguardando hoje', cls: 'pendente' },
    folga:      { label: 'Folga',           cls: 'folga' },
    feriado:    { label: 'Feriado',         cls: 'feriado' },
    sem_pausa:  { label: 'Sem pausa registrada', cls: 'sem_pausa' },
    futuro:     { label: '—',               cls: 'pendente' }
  };
  return map[status] || map.pendente;
}

async function calcularPeriodo(funcionario, startDate, endDate) {
  await carregarDiasEspeciais(funcionario.id);
  const punches = await getPunchesRange(funcionario.id, startDate, endDate);
  const porDia = {};
  punches.forEach(p => { const k = localKey(new Date(p.registrado_em)); (porDia[k] = porDia[k] || []).push(p); });
  const hojeKey = todayKey();
  const dias = [];
  for (let d = new Date(startDate); d < endDate; d.setDate(d.getDate() + 1)) {
    const key = localKey(d);
    dias.push(classificarDia(key, funcionario, porDia[key] || [], key === hojeKey));
  }
  return dias;
}

function resumoDias(dias) {
  const r = { trabalhado: 0, extraNormal: 0, extraFeriado: 0, deficit: 0, indenizacaoMin: 0, compensado: 0 };
  dias.forEach(d => {
    r.trabalhado += d.trabalhado;
    if (d.especial === 'feriado') r.extraFeriado += d.extra; else r.extraNormal += d.extra;
    r.deficit += d.deficit;
    r.indenizacaoMin += d.indenizacao;
    r.compensado += d.compensado || 0;
  });
  // Folgas compensadas abatem automaticamente das horas extras normais (as de feriado, 100%, não entram na compensação)
  r.extraNormalBruta = r.extraNormal;
  const usado = Math.min(r.extraNormal, r.compensado);
  r.extraNormal -= usado;
  r.compensadoUsado = usado;
  r.compensadoExcedente = r.compensado - usado;
  return r;
}

async function loadPunchGrid(funcionarioId, dispositivo) {
  const punches = await getPunchesToday(funcionarioId);

  const grid = document.getElementById('punchGrid');
  if (!grid) return;
  grid.className = 'punch-grid';
  grid.innerHTML = TIPOS.map(t => {
    const done = punches.some(p => p.tipo === t.key);
    const isNext = t.key === next;
    return `<button class="punch-btn ${isNext ? 'next' : ''}" ${(done || !isNext) ? 'disabled' : ''}
      onclick="confirmarPunch('${funcionarioId}', '${t.key}', '${dispositivo}')">${t.label}
      <span class="t">${done ? '✓ registrado' : t.short}</span></button>`;
  }).join('');
}

async function confirmarPunch(funcionarioId, tipo, dispositivo) {
  const tipoInfo = TIPOS.find(t => t.key === tipo);
  if (dispositivo === 'pessoal') {
    const func = state.personalUser;
    if (func && func.latitude != null && func.longitude != null) {
      showToast('Verificando localização...');
      const loc = await obterLocalizacao();
      if (!loc.ok) { showToast('❌ ' + loc.erro); return; }
      const raio = func.raio_metros || 50;
      const dist = Math.round(calcularDistanciaMetros(loc.lat, loc.lng, func.latitude, func.longitude));
      if (dist > raio) {
        showToast(`❌ Você está a ${dist}m do endereço liberado — só dá pra bater o ponto até ${raio}m de distância.`);
        return;
      }
    }
  }
  const modal = document.createElement('div');
  modal.className = 'feedback';
  modal.id = 'confirmPunchModal';
  modal.innerHTML = `
    <div style="font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:8px;">Confirmar</div>
    <h2 style="margin-bottom:2px;">${tipoInfo.label}</h2>
    <div class="clock-display" style="margin:8px 0 26px;">${fmtTime(new Date())}</div>
    <button class="btn btn-primary" style="width:230px" onclick="executarPunch('${funcionarioId}','${tipo}','${dispositivo}')">Tenho certeza</button>
    <button class="btn btn-outline" style="width:230px; margin-top:10px;" onclick="document.getElementById('confirmPunchModal').remove()">Cancelar</button>
  `;
  document.body.appendChild(modal);
}

async function executarPunch(funcionarioId, tipo, dispositivo) {
  document.getElementById('confirmPunchModal')?.remove();
  await doPunch(funcionarioId, tipo, dispositivo);
}

async function doPunch(funcionarioId, tipo, dispositivo) {
  await registrarPonto(funcionarioId, tipo, dispositivo);
  showFeedback(TIPOS.find(t => t.key === tipo).label);
  await loadPunchGrid(funcionarioId, dispositivo);
}
function showFeedback(label) {
  const el = document.createElement('div'); el.className = 'feedback';

}

async function excluirFuncionaria(id, nome) {
  const { count } = await sb.from('pontos').select('id', { count: 'exact', head: true }).eq('funcionario_id', id);
  const aviso = count ? `\n\nIsso apaga também os ${count} pontos batidos por ela, os pedidos de correção e as assinaturas. NÃO dá pra desfazer.` : '\n\nNÃO dá pra desfazer.';
  if (!confirm(`Excluir ${nome} de vez?${aviso}`)) return;
  try {
    for (const tabela of ['pontos', 'correcoes', 'assinaturas']) {
      const r = await sb.from(tabela).delete().eq('funcionario_id', id);
      if (r.error && tabela === 'pontos') throw r.error;
    }
    const { error } = await sb.from('funcionarios').delete().eq('id', id);
    if (error) throw error;
  } catch (e) { return showToast('Erro ao excluir: ' + (e.message || e)); }
  try { localStorage.removeItem(diasEspeciaisKey(id)); } catch (e) {}
  showToast('Funcionária excluída');
  state.adminDailyFocus = null;
  await loadFuncionarios();
  carregarListaFuncionarios();
}

};

async function geocodificarSeNecessario(enderecoNovo, latAtual, lngAtual, enderecoAntigo) {
  if (!enderecoNovo) return { lat: null, lng: null };
  if (enderecoNovo === enderecoAntigo && latAtual) return { lat: latAtual, lng: lngAtual };
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(enderecoNovo)}`);
    const data = await resp.json();
    if (data && data.length) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch (e) { /* segue sem localização */ }
  return { lat: null, lng: null };
}

async function salvarFuncionaria(id) {
  if (!sb) return showToast('Configure o Supabase antes de cadastrar');
  const nome = document.getElementById('fNome').value.trim();
  if (!nome) return showToast('Preencha o nome');
  const pin = document.getElementById('fPin').value.trim();
  if (pin && !/^\d{4}$/.test(pin)) return showToast('O PIN precisa ter exatamente 4 números (0 a 9), sem letras');
  const diasFolga = WEEKDAYS.map((_, i) => i).filter(i => document.getElementById('folga'+i).checked);
  const payload = {
    nome,
    pin,
    jornada_diaria_horas: parseFloat(document.getElementById('fJornada').value) || 8,
    valor_hora: parseFloat(document.getElementById('fValorHora').value) || null,
    dias_folga: diasFolga,
    dispositivo_permitido: 'loja',
    ativo: true,
    pin_tentativas: 0, pin_bloqueado: false, senha_tentativas: 0, senha_bloqueada: false
  };
  const { error } = id
    ? await sb.from('funcionarios').update(payload).eq('id', id)

  }

  const hoje = new Date();
  const mesSel = state.adminDailyMes || `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
  const [anoSel, mesNum] = mesSel.split('-').map(Number);
  const start = new Date(anoSel, mesNum - 1, 1);
  const fimMes = new Date(anoSel, mesNum, 1);
  const amanha = new Date(); amanha.setHours(0, 0, 0, 0); amanha.setDate(amanha.getDate() + 1);
  const end = fimMes < amanha ? fimMes : amanha;
  const dias = await calcularPeriodo(f, start, end);
  const resumo = resumoDias(dias);
  const opcoesMes = Array.from({ length: 12 }, (_, i) => { const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1); const v = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; return `<option value="${v}" ${v === mesSel ? 'selected' : ''}>${MESES_NOME[d.getMonth()]} ${d.getFullYear()}</option>`; }).join('');
  dias.reverse();
  const rows = dias.map(d => {
    const dateObj = new Date(d.dataKey + 'T12:00:00');
    const label = d.dataKey === todayKey() ? 'Hoje' : dateObj.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
    const nums = (d.status === 'completo' || d.status === 'andamento' || d.status === 'incompleto' || d.status === 'sem_pausa')
      ? `${fmtHoras(d.trabalhado)} trabalhado${d.extra > 0 ? ' · +' + fmtHoras(d.extra) + ' extra' : ''}${d.deficit > 0 ? ' · -' + fmtHoras(d.deficit) : ''}${d.indenizacao > 0 ? ' · intervalo suprimido' : ''}`
      : (d.compensado ? `${fmtHoras(d.compensado)} descontadas das horas extras` : '');
    return `<div class="day-row" onclick="abrirEdicaoDia('${f.id}','${d.dataKey}')">
      <div class="dinfo"><div class="dname">${label}</div><div class="dnums">${nums}</div></div>
      ${badge(d.status, extraBadge(d))}
    </div>`;
  }).join('');
  out.innerHTML = `
    <select onchange="state.adminDailyMes=this.value; renderDailyOut()">${opcoesMes}</select>
    <div class="eyebrow" style="margin-top:2px">${f.nome} · ${MESES_NOME[mesNum - 1]} ${anoSel}</div>

      <div class="summary-box"><div class="n">${fmtHoras(resumo.trabalhado)}</div><div class="l">Trabalhadas</div></div>

      <div class="summary-box"><div class="n">${fmtHoras(resumo.deficit)}</div><div class="l">Devedoras</div></div>

function combineLocal(dataKey, timeStr) {
  const [y, m, d] = dataKey.split('-').map(Number);
  const [hh, mm] = timeStr.split(':').map(Number);
  return new Date(y, m - 1, d, hh, mm, 0);
}

async function salvarEdicaoDia() {
  if (!sb) return showToast('Configure o Supabase antes de editar');
  const { funcId, dataKey } = state.adminEditDay;
  const punches = state.adminEditDayPunches || [];
  for (const t of TIPOS) {
    const input = document.getElementById('time_' + t.key);
    if (!input) continue;
    const val = input.value;
    const existing = punches.find(p => p.tipo === t.key);
    if (!val) {
      if (existing) await sb.from('pontos').delete().eq('id', existing.id);
      continue;
    }
    const iso = combineLocal(dataKey, val).toISOString();
    if (existing) {
      const existingHHMM = new Date(existing.registrado_em).toTimeString().slice(0, 5);
      if (existingHHMM !== val) await sb.from('pontos').update({ registrado_em: iso }).eq('id', existing.id);
    } else {
      await sb.from('pontos').insert({ funcionario_id: funcId, tipo: t.key, dispositivo: 'admin', registrado_em: iso });
    }
  }
  const especial = document.getElementById('diaEspecialSel').value;
  await setDiaEspecial(funcId, dataKey, especial || null);
  showToast('Dia atualizado!');
  state.adminDailyFocus = funcId;
  goTo('adminDaily');
}

async function carregarRelatorio() {
  const funcId = document.getElementById('repFunc').value;
  const mes = parseInt(document.getElementById('repMes').value);
  const ano = parseInt(document.getElementById('repAno').value);
  const func = (state.adminFuncionariosAll || []).find(f => f.id === funcId) || state.funcionarios.find(f => f.id === funcId);
  const out = document.getElementById('repOut');
  out.innerHTML = `<div class="empty">Calculando...</div>`;
  const start = new Date(ano, mes, 1);
  const end = new Date(ano, mes + 1, 1);
  const dias = await calcularPeriodo(func, start, end);
  const r = resumoDias(dias);
  const valorHora = func.valor_hora || 0;
  const totalExtraH = r.extraNormal + r.extraFeriado;
  const valorExtras = (r.extraNormal / 60) * valorHora * 1.5 + (r.extraFeriado / 60) * valorHora * 2;
  const valorIndenizacao = (r.indenizacaoMin / 60) * valorHora * 1.5;
  const saldoMin = totalExtraH - r.deficit;
  let bannerCls = 'badge-pendente', bannerTxt = 'Sem horas extras nem devedoras neste mês';
  if (totalExtraH > 0 && r.deficit === 0) { bannerCls = 'badge-completo'; bannerTxt = `Tem ${fmtHoras(totalExtraH)} de hora extra a pagar${valorHora ? ' — R$ ' + valorExtras.toFixed(2) : ''}`; }
  else if (r.deficit > 0 && totalExtraH === 0) { bannerCls = 'badge-falta'; bannerTxt = `Tem ${fmtHoras(r.deficit)} de hora devedora (ela deve à empresa)`; }
  else if (totalExtraH > 0 && r.deficit > 0) { bannerCls = 'badge-andamento'; bannerTxt = `Tem os dois: ${fmtHoras(totalExtraH)} extra e ${fmtHoras(r.deficit)} devedora — saldo final ${saldoMin >= 0 ? '+' : ''}${fmtHoras(saldoMin)}`; }
  const linhas = dias.filter(d => d.status !== 'futuro').map(d => `
    <tr>
      <td>${new Date(d.dataKey + 'T12:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})} ${badge(d.status, extraBadge(d))}</td>
      <td class="num">${d.trabalhado ? fmtHoras(d.trabalhado) : '—'}</td>
      <td class="num ${d.extra > 0 ? 'extra' : ''}">${d.extra > 0 ? fmtHoras(d.extra) : '—'}</td>
      <td class="num ${d.deficit > 0 ? 'deficit' : ''}">${d.deficit > 0 ? fmtHoras(d.deficit) : '—'}</td>
    </tr>`).join('');
  const periodo = `${ano}-${String(mes + 1).padStart(2, '0')}`;
  const ass = await buscarAssinaturaMes(func.id, periodo);
  const estadoAss = ass ? await estadoAssinatura(ass, func.id, periodo, dias) : null;
  const corrAprov = await buscarCorrecoesDoMes(func.id, periodo, 'aprovada');
  const corrPend = await buscarCorrecoesDoMes(func.id, periodo, 'pendente');
  state.ultimoRelatorio = { func, ano, mes, dias, r, valorHora, totalExtraH, valorExtras, valorIndenizacao, saldoMin, bannerTxt, ass, estadoAss, corrAprov, corrPend };
  let blocoAss;
  if (ass && estadoAss === 'ok') blocoAss = `<div class="assinatura-box" style="border-color:var(--success)">✅ Conferido e assinado digitalmente por ${esc(func.nome)} em ${fmtDataHora(ass.assinado_em)} (período até ${fmtPeriodo(ass.ate, ass.ate).split(' a ')[0]}).<br><span style="color:var(--muted)">Código ${codigoCurto(ass.hash)}</span></div>`;
  else if (ass) blocoAss = `<div class="assinatura-box" style="border-color:var(--amber)">⚠ ${esc(func.nome)} assinou em ${fmtDataHora(ass.assinado_em)}, mas o ponto foi alterado depois disso. Peça para ela conferir e assinar de novo.</div>`;
  else blocoAss = `<div class="assinatura-box">Ainda não assinado por ${esc(func.nome)}. Ela confere e assina em "Conferir e assinar meu ponto".</div>`;
  if (corrPend.length) blocoAss += `<div class="assinatura-box" style="border-color:var(--amber)">🔔 ${corrPend.length} correção(ões) deste mês aguardando a sua aprovação (Painel › Correções de ponto).</div>`;
  if (corrAprov.length) blocoAss += `<div class="assinatura-box"><b>Ajustes aprovados no mês</b>${corrAprov.map(c => `<div style="margin-top:6px"><span style="text-transform:capitalize">${fmtDiaCurto(c.data)}</span> — ${esc(c.motivo)}${diffHorarios(c.original, c.proposto)}</div>`).join('')}</div>`;
  out.innerHTML = `
    <div class="badge ${bannerCls}" style="display:flex; padding:12px 14px; font-size:13px; margin:14px 0 4px; white-space:normal; line-height:1.4"><span class="dot"></span>${bannerTxt}</div>
    <div class="summary-grid g3">
      <div class="summary-box"><div class="n">${fmtHoras(r.trabalhado)}</div><div class="l">Trabalhadas</div></div>
      <div class="summary-box"><div class="n">${fmtHoras(totalExtraH)}</div><div class="l">Extras</div></div>
      <div class="summary-box"><div class="n">${fmtHoras(r.deficit)}</div><div class="l">Devedoras</div></div>
    </div>
    ${r.compensado ? `<div class="assinatura-box">🗓 Folgas compensadas no mês: ${fmtHoras(r.compensado)}. Horas extras: ${fmtHoras(r.extraNormalBruta)} − ${fmtHoras(r.compensadoUsado)} compensadas = <b>${fmtHoras(r.extraNormal)}</b> a pagar${r.extraFeriado ? ' (+ ' + fmtHoras(r.extraFeriado) + ' de feriado)' : ''}.${r.compensadoExcedente ? `<br><span style="color:var(--muted)">Sobraram ${fmtHoras(r.compensadoExcedente)} de folga além das horas extras do mês (ficam como dispensa, sem desconto).</span>` : ''}</div>` : ''}
    ${valorHora ? `<div class="summary-grid">
      <div class="summary-box"><div class="n">R$ ${valorExtras.toFixed(2)}</div><div class="l">Valor horas extras</div></div>

    <div class="card" style="padding:14px">

      <tbody>${linhas || '<tr><td colspan="4" class="empty">Sem registros neste mês</td></tr>'}</tbody></table>
    </div>
    <div class="muted-small">Jornada: ${fmtHoras((func.jornada_diaria_horas||8)*60)}/dia · extra normal +50%, feriado trabalhado +100% ·
    intervalo obrigatório 1h (jornada &gt;6h) ou 15min (&gt;4h), tolerância de ${TOLERANCIA_MIN}min · intervalo suprimido além da tolerância gera indenização de 1,5x (não é hora extra, não reflete em FGTS/13º/férias) ·
    dias marcados como folga compensada/abono não geram débito. Ajuste feriados, folgas e abonos na tela de Acompanhamento diário.</div>

function gerarPdfRelatorio(d) {
  const { func, ano, mes, dias, r, valorHora, totalExtraH, valorExtras, valorIndenizacao, bannerTxt } = d;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const mesNome = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][mes];
  const margem = 40;
  let y = margem;

  // Cabeçalho
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(15, 20, 23);
  doc.text('Ponto Nauta', margem, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(120, 120, 120);
  doc.text('Acompanhamento diário e relatório de horas', margem, y + 14);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(20, 20, 20);
  doc.text(func.nome, 555, y, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(120, 120, 120);
  doc.text(`${mesNome} de ${ano}`, 555, y + 14, { align: 'right' });
  y += 26;
  doc.setDrawColor(58, 166, 160); doc.setLineWidth(2);
  doc.line(margem, y, 555, y);
  y += 22;

  // Banner-resumo
  doc.setFillColor(244, 244, 244);
  const bannerLinhas = doc.splitTextToSize(bannerTxt, 495);

      const txt = `${c.data.slice(8, 10)}/${c.data.slice(5, 7)}: ${mudancas} (${c.motivo}${c.observacao ? ' - ' + c.observacao : ''})`;

  }
  espaco(70);
  doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.6); doc.line(margem, yFinal, margem + 515, yFinal); yFinal += 16;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
  if (ass && estadoAss === 'ok') {
    doc.setTextColor(31, 157, 99);

    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(60, 60, 60);

    doc.setFontSize(8); doc.setTextColor(120, 120, 120);
    doc.text(`Código de verificação (SHA-256): ${ass.hash.slice(0, 32)}`, margem, yFinal);
  } else if (ass) {
    doc.setTextColor(184, 119, 15);

    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(60, 60, 60);
    doc.text(`Assinatura de ${fmtDH(ass.assinado_em)} não confere mais com os horários atuais. É preciso conferir e assinar de novo.`, margem, yFinal);
  } else {
    doc.setTextColor(120, 120, 120);
    doc.text('Ainda não conferido/assinado pela funcionária', margem, yFinal);
  }

  return doc;
}

/* ---------------------------------------------------------------------
   Correção de ponto + conferência/assinatura digital da funcionária
   - Ela pede a correção de um dia, confere e assina com PIN (loja) ou
     senha (celular). O pedido fica PENDENTE até a administradora aprovar.
   - No fim do mês ela confere o espelho e assina; a assinatura guarda
     um código (SHA-256) do conteúdo e avisa se o ponto mudar depois.
--------------------------------------------------------------------- */
const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MOTIVOS_CORRECAO = [
  'Esqueci de bater',
  'Bati o tipo errado (ex.: saída no lugar da saída do almoço)',
  'Não consegui bater (sem sinal / sistema fora do ar)',
  'Outro motivo'
];

/* Prazo de correção: mês atual; o mês passado também até o 3º dia útil (segunda a sábado, sem feriado) do mês atual */
function limiteCorrecao() {
  const h = new Date(), ano = h.getFullYear(), mes = h.getMonth();
  let n = 0, terceiro = null;
  for (let d = 1; d <= 31 && n < 3; d++) {
    const dt = new Date(ano, mes, d); if (dt.getMonth() !== mes) break;
    if (dt.getDay() !== 0 && !isFeriadoPadrao(localKey(dt))) { n++; if (n === 3) terceiro = localKey(dt); }
  }
  const passadoAberto = !!terceiro && todayKey() <= terceiro;
  return { min: localKey(new Date(ano, passadoAberto ? mes - 1 : mes, 1)), terceiro, passadoAberto };
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hhmm(iso) { return new Date(iso).toTimeString().slice(0, 5); }
function fmtDiaLongo(dataKey) { return new Date(dataKey + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }); }
function fmtDiaCurto(dataKey) { return new Date(dataKey + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }); }
function fmtDataHora(iso) { const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function codigoCurto(hash) { return (hash || '').slice(0, 10).toUpperCase(); }
function empAtual() { return state.empMode === 'pessoal' ? state.personalUser : state.selectedFuncionario; }
function empVoltarJs() { return state.empMode === 'pessoal' ? "goTo('personalPunch')" : "goTo('kioskPunch')"; }
function fmtPeriodo(dataKeyIni, dataKeyFim) { const f = k => k.slice(8, 10) + '/' + k.slice(5, 7); return f(dataKeyIni) + ' a ' + f(dataKeyFim); }

async function sha256Hex(txt) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) >>> 0;
    return 'f' + h.toString(16).padStart(8, '0') + txt.length.toString(16).padStart(8, '0');
  }
}

/* Confere PIN (loja) ou senha (celular) no servidor; usa o mesmo bloqueio de 3 erros */
async function verificarCredencial(func, dispositivo, valor) {
  if (!sb) return { ok: false, msg: 'Sem conexão com o servidor. Tente de novo em instantes.' };
  const loja = dispositivo !== 'pessoal';
  const campo = loja ? 'pin' : 'senha', tentC = loja ? 'pin_tentativas' : 'senha_tentativas', bloqC = loja ? 'pin_bloqueado' : 'senha_bloqueada';
  const { data: fresh } = await sb.from('funcionarios').select(`id, ${campo}, ${tentC}, ${bloqC}`).eq('id', func.id).maybeSingle();
  if (!fresh) return { ok: false, msg: 'Não consegui verificar. Tente de novo.' };
  if (fresh[bloqC]) return { ok: false, msg: `🔒 ${loja ? 'PIN' : 'Senha'} bloqueado(a). Fale com a administradora.` };
  if (String(fresh[campo]) === String(valor)) {
    await sb.from('funcionarios').update({ [tentC]: 0 }).eq('id', func.id);
    return { ok: true };
  }
  const t = (fresh[tentC] || 0) + 1;
  const bloq = t >= 3;
  await sb.from('funcionarios').update({ [tentC]: t, [bloqC]: bloq }).eq('id', func.id);
  return { ok: false, msg: bloq ? `🔒 ${loja ? 'PIN' : 'Senha'} bloqueado(a). Fale com a administradora.` : `${loja ? 'PIN' : 'Senha'} incorreto(a) (tentativa ${t} de 3)` };
}

function mostrarAssinatura({ titulo, corpoHtml, declaracao, confirmarJs, botao }) {

  const el = document.createElement('div');
  el.className = 'sheet'; el.id = 'assSheet';

}
function fecharAssinatura() { document.getElementById('assSheet')?.remove(); }

async function validarAssinatura() {
  if (!document.getElementById('assCheck').checked) { showToast('Marque a declaração para poder assinar'); return false; }
  const valor = document.getElementById('assCred').value;
  if (!valor) { showToast(state.empMode === 'pessoal' ? 'Digite sua senha' : 'Digite seu PIN'); return false; }
  const btn = document.getElementById('assBtn'); btn.disabled = true;
  const r = await verificarCredencial(empAtual(), state.empMode === 'pessoal' ? 'pessoal' : 'loja', valor);
  btn.disabled = false;
  if (!r.ok) { showToast(r.msg); return false; }
  return true;
}

/* --- Visual das diferenças antes -> depois --- */
function diffHorarios(orig, prop, comoBloco) {
  const itens = TIPOS.filter(t => ((orig || {})[t.key] || '') !== ((prop || {})[t.key] || '')).map(t => {
    const o = (orig || {})[t.key] || '', n = (prop || {})[t.key] || '';
    return `${t.label}: ${o ? esc(o) : '—'} <span class="arrow">→</span> <strong>${n ? esc(n) : 'apagar'}</strong>`;
  });
  return comoBloco ? itens.map(i => `<div>${i}</div>`).join('') : itens.map(i => `<div style="font-size:12px; margin-top:3px">${i}</div>`).join('');
}
function badgeCorrecao(status) {
  const m = { pendente: ['andamento', 'Aguardando aprovação'], aprovada: ['completo', 'Aprovada'], recusada: ['falta', 'Recusada'] }[status] || ['pendente', status];

async function carregarDiaCorrecao() {
  const f = empAtual(); const el = document.getElementById('corrCampos');
  const dataKey = document.getElementById('corrData')?.value;
  if (!el || !f) return;
  if (!dataKey) { el.innerHTML = '<div class="empty">Escolha um dia.</div>'; return; }
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const start = new Date(dataKey + 'T00:00:00'); const end = new Date(start); end.setDate(end.getDate() + 1);
  const punches = await getPunchesRange(f.id, start, end);
  if (document.getElementById('corrData')?.value !== dataKey) return;
  const orig = {};
  TIPOS.forEach(t => { const p = punches.find(x => x.tipo === t.key); orig[t.key] = p ? hhmm(p.registrado_em) : ''; });
  state.corrOriginal = { dataKey, orig };
  const nomeFer = nomeFeriado(dataKey);
  el.innerHTML = `<div class="eyebrow" style="text-transform:capitalize">${fmtDiaLongo(dataKey)}</div>
    ${nomeFer ? `<div class="muted-small" style="margin:-2px 0 10px">Feriado: ${esc(nomeFer)}</div>` : ''}
    ${TIPOS.map(t => `<label>${t.label}</label><input type="time" id="ctime_${t.key}" value="${orig[t.key]}">`).join('')}
    <div class="muted-small">Coloque o horário certo em cada campo. Deixe em branco o que não aconteceu naquele dia.</div>`;
}

async function abrirAssinaturaCorrecao() {
  const f = empAtual(); const o = state.corrOriginal;
  if (!f || !o) return showToast('Escolha o dia primeiro');
  if (!sb) return showToast('Sem conexão com o servidor. Tente de novo em instantes.');
  const dataKey = document.getElementById('corrData').value;
  if (dataKey !== o.dataKey) return showToast('Aguarde o dia carregar');
  { const lim = limiteCorrecao(); if (dataKey < lim.min || dataKey > todayKey()) return showToast(lim.passadoAberto ? 'Esse dia está fora do prazo de correção' : 'Só dá pra corrigir dias do mês atual (o mês passado fecha no 3º dia útil)'); }
  const prop = {}; TIPOS.forEach(t => prop[t.key] = document.getElementById('ctime_' + t.key)?.value || '');
  if (!TIPOS.some(t => prop[t.key] !== o.orig[t.key])) return showToast('Você ainda não mudou nenhum horário');
  const preench = TIPOS.filter(t => prop[t.key]);
  for (let i = 1; i < preench.length; i++) {
    if (prop[preench[i].key] <= prop[preench[i - 1].key]) return showToast(`"${preench[i].label}" precisa ser depois de "${preench[i - 1].label}"`);
  }
  if (dataKey === todayKey()) {
    const agora = new Date().toTimeString().slice(0, 5);
    const fut = preench.find(t => prop[t.key] > agora);
    if (fut) return showToast(`"${fut.label}" está no futuro — confira o horário`);
  }
  const motivo = document.getElementById('corrMotivo').value;
  const obs = document.getElementById('corrObs').value.trim();
  if (motivo === 'Outro motivo' && obs.length < 5) return showToast('Explique o motivo no campo abaixo');
  const { data: pend, error } = await sb.from('correcoes').select('id').eq('funcionario_id', f.id).eq('data', dataKey).eq('status', 'pendente').limit(1);
  if (error) return showToast('Erro: ' + error.message);

    titulo: 'Confirmar correção',
    corpoHtml: `<div class="eyebrow" style="text-transform:capitalize">${fmtDiaLongo(dataKey)}</div>
      <div class="diff">${diffHorarios(o.orig, prop, true)}</div>
      <div class="muted-small" style="margin-top:8px">Motivo: ${esc(motivo)}${obs ? ' — ' + esc(obs) : ''}</div>`,
    declaracao: 'Declaro que os horários acima conferem com o que realmente aconteceu neste dia.',
    confirmarJs: 'enviarCorrecaoAssinada()',

  });
}

async function enviarCorrecaoAssinada() {
  const r = state.corrRascunho; const f = empAtual();
  if (!r || !f) return;

  const assinadoEm = new Date().toISOString();
  const fmt = obj => TIPOS.map(t => t.key + '=' + (obj[t.key] || '-')).join(',');
  const conteudo = ['CORRECAO', f.id, r.dataKey, fmt(r.orig), fmt(r.prop), r.motivo, r.obs, assinadoEm].join('|');
  const hash = await sha256Hex(conteudo);
  const { error } = await sb.from('correcoes').insert({
    funcionario_id: f.id, data: r.dataKey, original: r.orig, proposto: r.prop, motivo: r.motivo, observacao: r.obs,
    dispositivo: state.empMode === 'pessoal' ? 'pessoal' : 'loja', status: 'pendente',
    assinatura_hash: hash, assinatura_conteudo: conteudo, assinado_em: assinadoEm
  });
  if (error) return showToast('Não consegui enviar: ' + error.message);
  fecharAssinatura();
  state.corrRascunho = null;
  const el = document.createElement('div'); el.className = 'feedback';
  el.innerHTML = `<div class="icon">✓</div><h2>Pedido assinado e enviado</h2><p>Aguarde a aprovação da administradora.<br>Código ${codigoCurto(hash)}</p>`;

function conteudoAssinaturaMes(funcId, periodo, ate, dias) {
  const linhas = [];
  dias.filter(d => d.dataKey <= ate).forEach(d => TIPOS.forEach(t => { if (d.byTipo[t.key]) linhas.push(`${d.dataKey}|${t.key}|${hhmm(d.byTipo[t.key])}`); }));
  return ['ESPELHO', funcId, periodo, ate, ...linhas].join('\n');
}
async function buscarAssinaturaMes(funcId, periodo) {
  if (!sb) return null;
  const { data, error } = await sb.from('assinaturas').select('*').eq('funcionario_id', funcId).eq('periodo', periodo).order('assinado_em', { ascending: false }).limit(1);
  return (!error && data && data.length) ? data[0] : null;
}
async function buscarCorrecoesDoMes(funcId, periodo, status) {
  if (!sb) return [];
  const [a, m] = periodo.split('-').map(Number);
  const ini = periodo + '-01', fim = localKey(new Date(a, m, 0));
  let q = sb.from('correcoes').select('*').eq('funcionario_id', funcId).gte('data', ini).lte('data', fim).order('data');
  if (status) q = q.eq('status', status);
  const { data, error } = await q;
  return error ? [] : (data || []);
}
/* 'ok' se o ponto continua igual ao que ela assinou; 'alterado' se mudou depois */
async function estadoAssinatura(ass, funcId, periodo, dias) {
  const conteudo = conteudoAssinaturaMes(funcId, periodo, ass.ate, dias);
  return (await sha256Hex(conteudo)) === ass.hash ? 'ok' : 'alterado';
}

async function carregarEspelho() {
  const f = empAtual(); const out = document.getElementById('espOut'); const sel = document.getElementById('espMes');
  if (!f || !out || !sel) return;
  const periodo = sel.value;
  out.innerHTML = '<div class="empty">Carregando...</div>';
  if (!sb) { out.innerHTML = '<div class="empty">Sem conexão com o servidor.</div>'; return; }
  const [a, m] = periodo.split('-').map(Number);
  const inicio = new Date(a, m - 1, 1), fimMes = new Date(a, m, 0);
  const ontem = new Date(); ontem.setHours(0, 0, 0, 0); ontem.setDate(ontem.getDate() - 1);
  const ate = fimMes < ontem ? fimMes : ontem;
  if (ate < inicio) { out.innerHTML = '<div class="empty">Ainda não há dias fechados neste mês.</div>'; return; }
  const ateKey = localKey(ate);
  const fim = new Date(ate); fim.setDate(fim.getDate() + 1);
  const dias = await calcularPeriodo(f, inicio, fim);
  const [ass, pend] = await Promise.all([buscarAssinaturaMes(f.id, periodo), buscarCorrecoesDoMes(f.id, periodo, 'pendente')]);
  if (document.getElementById('espMes')?.value !== periodo) return;
  state.espCache = { f, periodo, ateKey, dias };
  const hh = (d, t) => d.byTipo[t] ? hhmm(d.byTipo[t]) : '—';
  const linhas = dias.map(d => {
    const rotulo = statusMeta(d.status).label;
    const temBatida = Object.keys(d.byTipo).length > 0;
    const incompleto = d.status === 'incompleto' || d.status === 'sem_pausa';
    const dia = `<td>${incompleto ? '⚠ ' : ''}${fmtDiaCurto(d.dataKey)}</td>`;
    let resto;
    if (!temBatida) resto = `<td colspan="4" class="${d.status === 'falta' ? 'erro' : ''}" style="color:${d.status === 'falta' ? '' : 'var(--muted)'}">${d.status === 'feriado' && nomeFeriado(d.dataKey) ? esc(nomeFeriado(d.dataKey)) : (d.status === 'falta' ? 'Sem batida' : (d.rotuloFolga || rotulo))}</td>`;
    else resto = ['entrada', 'saida_almoco', 'volta_almoco', 'saida'].map(t => `<td class="${incompleto && !d.byTipo[t] ? 'aviso' : ''}">${hh(d, t)}</td>`).join('');
    return `<tr class="clicavel" onclick="abrirCorrecaoDoDia('${d.dataKey}')">${dia}${resto}</tr>`;
  }).join('');
  const temIncompleto = dias.some(d => d.status === 'incompleto' || d.status === 'sem_pausa');
  let estado = null;
  if (ass) estado = await estadoAssinatura(ass, f.id, periodo, dias);
  let bloco;
  const podeAssinar = !pend.length;
  const botaoAss = (txt) => podeAssinar
    ? `<button class="btn btn-primary" onclick="abrirAssinaturaMes()">${txt}</button>`
    : `<div class="assinatura-box" style="border-color:var(--amber)">Você tem ${pend.length} pedido(s) de correção aguardando aprovação neste mês. Assine depois que forem resolvidos.</div>`;
  if (ass && estado === 'ok' && ass.ate >= ateKey) {
    bloco = `<div class="assinatura-box" style="border-color:var(--success)">✅ Você assinou este período em ${fmtDataHora(ass.assinado_em)}.<br><span style="color:var(--muted)">Código ${codigoCurto(ass.hash)}</span></div>`;
  } else if (ass && estado === 'ok') {
    bloco = `<div class="assinatura-box">Você assinou até ${fmtPeriodo(ass.ate, ass.ate).split(' a ')[0]} (${fmtDataHora(ass.assinado_em)}). Chegaram dias novos desde então.</div>${botaoAss('Assinar até ' + fmtPeriodo(ateKey, ateKey).split(' a ')[0])}`;
  } else if (ass) {
    bloco = `<div class="assinatura-box" style="border-color:var(--amber)">⚠ O ponto mudou depois da sua assinatura de ${fmtDataHora(ass.assinado_em)} (ajuste aprovado ou edição da administradora). Confira de novo e assine outra vez.</div>${botaoAss('Assinar novamente')}`;
  } else {
    bloco = botaoAss('Está tudo certo — assinar');
  }
  out.innerHTML = `
    <div class="eyebrow" style="margin-top:6px">${esc(f.nome)} · ${fmtPeriodo(periodo + '-01', ateKey)}</div>
    <div class="card" style="padding:10px 12px">
      <table><thead><tr><th>Dia</th><th>Entr.</th><th>Saí. alm.</th><th>Volta</th><th>Saída</th></tr></thead><tbody>${linhas}</tbody></table>
    </div>
    <div class="muted-small" style="margin:-6px 0 12px">${temIncompleto ? '⚠ = faltou alguma batida. ' : ''}Toque num dia para pedir correção.</div>
    ${bloco}`;
}

function abrirAssinaturaMes() {
  const c = state.espCache;
  if (!c) return;

  const faltas = c.dias.filter(d => d.status === 'falta').length;
  const incompletos = c.dias.filter(d => d.status === 'incompleto' || d.status === 'sem_pausa').length;
  mostrarAssinatura({
    titulo: 'Assinar meu ponto',
    corpoHtml: `<div class="eyebrow">${fmtPeriodo(c.periodo + '-01', c.ateKey)}</div>
      <div class="diff">${comBatida} dia(s) com batidas<br>${faltas} dia(s) sem batida<br>${incompletos ? `<span style="color:var(--amber)">${incompletos} dia(s) com batida faltando</span>` : 'Nenhum dia com batida faltando'}</div>`,
    declaracao: `Declaro que os horários do período de ${fmtPeriodo(c.periodo + '-01', c.ateKey)} conferem com o que realmente aconteceu.`,
    confirmarJs: 'enviarAssinaturaMes()',
    botao: 'Assinar'
  });
}

async function enviarAssinaturaMes() {
  const c = state.espCache; const f = empAtual();

  if (!(await validarAssinatura())) return;

}

async function aprovarCorrecao(id) {
  if (!sb) return;
  const { data: c } = await sb.from('correcoes').select('*').eq('id', id).maybeSingle();
  if (!c || c.status !== 'pendente') { showToast('Esse pedido já foi resolvido'); return carregarCorrecoes(); }
  const start = new Date(c.data + 'T00:00:00'); const end = new Date(start); end.setDate(end.getDate() + 1);
  const punches = await getPunchesRange(c.funcionario_id, start, end);
  const atual = {}; TIPOS.forEach(t => { const p = punches.find(x => x.tipo === t.key); atual[t.key] = p ? hhmm(p.registrado_em) : ''; });
  if (TIPOS.some(t => (atual[t.key] || '') !== ((c.original || {})[t.key] || ''))) {
    if (!confirm('Os horários desse dia mudaram depois do pedido. Aprovar vai deixar o dia exatamente como ela assinou. Continuar?')) return;
  }
  try {
    const ok = r => { if (r.error) throw r.error; return r; };
    for (const t of TIPOS) {
      const novo = (c.proposto || {})[t.key] || '', existente = punches.find(x => x.tipo === t.key);
      if (!novo) { if (existente) ok(await sb.from('pontos').delete().eq('id', existente.id)); continue; }
      const iso = combineLocal(c.data, novo).toISOString();
      if (existente) { if (atual[t.key] !== novo) ok(await sb.from('pontos').update({ registrado_em: iso }).eq('id', existente.id)); }
      else {
        let r = await sb.from('pontos').insert({ funcionario_id: c.funcionario_id, tipo: t.key, dispositivo: 'correcao', registrado_em: iso });
        if (r.error) r = await sb.from('pontos').insert({ funcionario_id: c.funcionario_id, tipo: t.key, dispositivo: 'admin', registrado_em: iso });
        ok(r);
      }
    }
    ok(await sb.from('correcoes').update({ status: 'aprovada', decidido_em: new Date().toISOString() }).eq('id', id));
  } catch (e) { return showToast('Erro ao aplicar: ' + (e.message || e)); }
  showToast('Correção aprovada e aplicada ao ponto');
  carregarCorrecoes();
}

async function recusarCorrecao(id) {
  if (!sb) return;
  const obs = prompt('Por que está recusando? (a funcionária vai ver)');
  if (obs === null) return;
  const { error } = await sb.from('correcoes').update({ status: 'recusada', decidido_em: new Date().toISOString(), decisao_obs: obs.trim() }).eq('id', id).eq('status', 'pendente');
  if (error) return showToast('Erro: ' + error.message);
  showToast('Pedido recusado');
  carregarCorrecoes();
}

async function checkPin() {
  const f = state.selectedFuncionario;
  if (!sb) {
    if (String(f.pin) === state.pin) goTo('kioskPunch');
    else { showToast('PIN incorreto'); state.pin = ''; setTimeout(render, 400); }
    return;
  }
  const { data: fresh } = await sb.from('funcionarios').select('id, pin, pin_tentativas, pin_bloqueado').eq('id', f.id).maybeSingle();
  if (!fresh) { showToast('Erro ao verificar PIN'); state.pin = ''; setTimeout(render, 400); return; }
  if (fresh.pin_bloqueado) {
    showToast('🔒 PIN bloqueado após 3 tentativas erradas. Peça para a administradora desbloquear.');
    state.pin = ''; setTimeout(render, 600);
    return;
  }
  if (String(fresh.pin) === state.pin) {
    await sb.from('funcionarios').update({ pin_tentativas: 0 }).eq('id', f.id);
    goTo('kioskPunch');
  } else {
    const tentativas = (fresh.pin_tentativas || 0) + 1;
    const bloqueado = tentativas >= 3;
    await sb.from('funcionarios').update({ pin_tentativas: tentativas, pin_bloqueado: bloqueado }).eq('id', f.id);
    showToast(bloqueado ? '🔒 PIN bloqueado. Fale com a administradora.' : `PIN incorreto (tentativa ${tentativas} de 3)`);
    state.pin = ''; setTimeout(render, 400);
  }
}

async function personalLogin() {
  const usuario = document.getElementById('puser').value.trim();
  const senha = document.getElementById('ppass').value;
  if (!usuario || !senha) return showToast('Preencha usuário e senha');
  if (!sb) {
    const found = state.funcionarios.find(f => f.usuario === usuario && f.senha === senha);
    if (!found) return showToast('Usuário ou senha incorretos');
    lsSet(LS_PERSONAL_SESSION, found); state.personalUser = found; goTo('personalPunch');
    return;
  }
  const { data: found } = await sb.from('funcionarios').select('*').eq('usuario', usuario).eq('ativo', true).maybeSingle();
  if (!found) return showToast('Usuário ou senha incorretos');
  if ((found.dispositivo_permitido || 'ambos') === 'loja') return showToast('Essa conta só pode bater ponto no computador da loja, não pelo celular.');
  if (found.senha_bloqueada) return showToast('🔒 Senha bloqueada após 3 tentativas erradas. Peça para a administradora desbloquear.');
  if (found.senha === senha) {
    await sb.from('funcionarios').update({ senha_tentativas: 0 }).eq('id', found.id);
    lsSet(LS_PERSONAL_SESSION, found); state.personalUser = found; goTo('personalPunch');
  } else {
    const tentativas = (found.senha_tentativas || 0) + 1;
    const bloqueada = tentativas >= 3;
    await sb.from('funcionarios').update({ senha_tentativas: tentativas, senha_bloqueada: bloqueada }).eq('id', found.id);
    showToast(bloqueada ? '🔒 Senha bloqueada. Fale com a administradora.' : `Senha incorreta (tentativa ${tentativas} de 3)`);
  }
}
